<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <linearGradient id="goldText" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#DFB76C" />
      <stop offset="70%" stop-color="#FCEABB" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="75%" stop-color="#080808" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="800" height="800" fill="#050505" />

  <!-- Gold Glitter Particle Cloud Ring -->
  <g opacity="0.85">
    <!-- Golden particles array around perimeter -->
    <!-- Inner halo -->
    <circle cx="400" cy="400" r="280" fill="url(#goldGlow)" />
    
    <!-- Outer glitter sparkles -->
    <g fill="#f5d77f">
      <circle cx="210" cy="180" r="3" opacity="0.8"/><circle cx="240" cy="150" r="2" opacity="0.6"/><circle cx="270" cy="130" r="4" opacity="0.9"/>
      <circle cx="310" cy="110" r="2.5" opacity="0.7"/><circle cx="360" cy="95" r="3.5" opacity="0.85"/><circle cx="400" cy="90" r="2" opacity="0.5"/>
      <circle cx="440" cy="95" r="4" opacity="0.9"/><circle cx="490" cy="110" r="2.5" opacity="0.6"/><circle cx="530" cy="130" r="3" opacity="0.75"/>
      <circle cx="570" cy="160" r="4.5" opacity="0.95"/><circle cx="610" cy="200" r="2" opacity="0.6"/><circle cx="640" cy="250" r="3.5" opacity="0.8"/>
      <circle cx="660" cy="300" r="2" opacity="0.5"/><circle cx="670" cy="350" r="4" opacity="0.9"/><circle cx="675" cy="400" r="2.5" opacity="0.65"/>
      <circle cx="670" cy="450" r="3.5" opacity="0.85"/><circle cx="655" cy="500" r="2" opacity="0.6"/><circle cx="630" cy="550" r="4" opacity="0.9"/>
      <circle cx="600" cy="600" r="3" opacity="0.75"/><circle cx="560" cy="640" r="2.5" opacity="0.7"/><circle cx="510" cy="670" r="4.5" opacity="0.95"/>
      <circle cx="460" cy="690" r="2" opacity="0.5"/><circle cx="400" cy="700" r="3.5" opacity="0.85"/><circle cx="340" cy="690" r="2" opacity="0.6"/>
      <circle cx="290" cy="670" r="4" opacity="0.9"/><circle cx="240" cy="635" r="2.5" opacity="0.7"/><circle cx="200" cy="595" r="3.5" opacity="0.8"/>
      <circle cx="170" cy="550" r="2" opacity="0.6"/><circle cx="145" cy="500" r="4" opacity="0.9"/><circle cx="130" cy="450" r="2.5" opacity="0.65"/>
      <circle cx="125" cy="400" r="3.5" opacity="0.85"/><circle cx="135" cy="350" r="2" opacity="0.5"/><circle cx="150" cy="300" r="4.5" opacity="0.95"/>
      <circle cx="175" cy="250" r="2.5" opacity="0.7"/><circle cx="190" cy="210" r="3" opacity="0.8"/>
    </g>
    <!-- Secondary fine stardust glitter -->
    <g fill="#e5b842">
      <circle cx="230" cy="220" r="2" opacity="0.9"/><circle cx="270" cy="180" r="1.5" opacity="0.8"/><circle cx="320" cy="150" r="2.5" opacity="0.9"/>
      <circle cx="370" cy="135" r="1.8" opacity="0.7"/><circle cx="430" cy="135" r="2.2" opacity="0.9"/><circle cx="480" cy="150" r="1.5" opacity="0.6"/>
      <circle cx="530" cy="180" r="2.8" opacity="0.85"/><circle cx="575" cy="220" r="1.5" opacity="0.7"/><circle cx="610" cy="280" r="2.4" opacity="0.9"/>
      <circle cx="630" cy="340" r="1.6" opacity="0.7"/><circle cx="635" cy="400" r="2.6" opacity="0.85"/><circle cx="625" cy="460" r="1.8" opacity="0.7"/>
      <circle cx="600" cy="520" r="2.5" opacity="0.9"/><circle cx="560" cy="575" r="1.5" opacity="0.6"/><circle cx="510" cy="620" r="2.8" opacity="0.85"/>
      <circle cx="450" cy="645" r="1.6" opacity="0.7"/><circle cx="400" cy="650" r="2.5" opacity="0.9"/><circle cx="340" cy="640" r="1.5" opacity="0.6"/>
      <circle cx="280" cy="610" r="2.8" opacity="0.85"/><circle cx="235" cy="565" r="1.6" opacity="0.7"/><circle cx="200" cy="510" r="2.5" opacity="0.9"/>
      <circle cx="175" cy="445" r="1.7" opacity="0.6"/><circle cx="170" cy="390" r="2.6" opacity="0.85"/><circle cx="180" cy="330" r="1.5" opacity="0.7"/>
      <circle cx="205" cy="275" r="2.4" opacity="0.8"/>
    </g>
    <!-- Bright star sparkles -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M 280,140 Q 280,145 285,145 Q 280,145 280,150 Q 280,145 275,145 Q 280,145 280,140 Z" />
      <path d="M 520,130 Q 520,136 526,136 Q 520,136 520,142 Q 520,136 514,136 Q 520,136 520,130 Z" />
      <path d="M 645,320 Q 645,326 651,326 Q 645,326 645,332 Q 645,326 639,326 Q 645,326 645,320 Z" />
      <path d="M 580,590 Q 580,596 586,596 Q 580,596 580,602 Q 580,596 574,596 Q 580,596 580,590 Z" />
      <path d="M 220,530 Q 220,536 226,536 Q 220,536 220,542 Q 220,536 214,536 Q 220,536 220,530 Z" />
      <path d="M 155,360 Q 155,366 161,366 Q 155,366 155,372 Q 155,366 149,366 Q 155,366 155,360 Z" />
    </g>
  </g>

  <!-- Central Circular Medal Body -->
  <circle cx="400" cy="400" r="215" fill="url(#centerDark)" />

  <!-- Outer Double Metallic Gold Ring -->
  <circle cx="400" cy="400" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="7" />
  <circle cx="400" cy="400" r="207" fill="none" stroke="#2a2210" stroke-width="2" />
  <circle cx="400" cy="400" r="202" fill="none" stroke="url(#goldGradient)" stroke-width="3" />

  <!-- Inner Subtle Ring -->
  <circle cx="400" cy="400" r="195" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="3, 3" opacity="0.4" />

  <!-- Déjà Rêve Script Text -->
  <g id="brand-text">
    <text x="400" y="415" 
          text-anchor="middle" 
          font-family="'Great Vibes', 'Brush Script MT', 'Alex Brush', cursive" 
          font-size="94" 
          font-weight="normal"
          fill="url(#goldText)"
          filter="url(#goldShine)"
          letter-spacing="1">
      Déjà Rêve
    </text>

    <!-- Subtitle: "ONCE A DREAM, NOW REALITY" -->
    <text x="400" y="465" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', serif" 
          font-size="12.5" 
          font-weight="600"
          letter-spacing="5.5" 
          fill="#DFB76C"
          opacity="0.92">
      "ONCE A DREAM, NOW REALITY"
    </text>
  </g>
</svg>
